name: Supabase keep-alive

# The Supabase free plan pauses a project after about a week without database
# activity. This job runs one small read on production and on homolog twice a week.
# GitHub suspends scheduled workflows after 60 days without repository activity;
# re-enable it in the Actions tab if that happens.

on:
  schedule:
    - cron: '13 10 * * 1,4' # Mondays and Thursdays, 07:13 in Brasília (10:13 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read one row from each database
        run: node .github/scripts/supabase-keepalive.mjs
